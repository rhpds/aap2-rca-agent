name: Batch analysis via CronJob (OpenShift)

# Tier 2: installs the REAL chart via Helm into the CI namespace and runs one
# batch from the actual CronJob (init container, SSH tunnel, settings secret,
# CronJob spec), backed entirely by synthetic infrastructure — the chart's
# db-bastion fields point at the CI sshd pod and its db-remote fields at the
# CI Postgres, so the CronJob's own tunnel forwards through our sshd to our
# database. Nothing real is touched.
#
# The only GitHub-side secret is KUBECONFIG_B64.

# SECURITY MODEL: on pull_request_target events, the workflow definition runs
# from the PR's base branch but the PR's code is checked out and executed
# (Dockerfile RUN steps, ci/* scripts) WITH cluster credentials available.
# The safe-to-test label is the human trust gate — only add it after reviewing
# the diff, especially deploy/Dockerfile, ci/*, and workflow-affecting files.

on:
  push:
    branches: [ocp-testing]        # dev-branch iteration; drop once the label gate is live on main
  pull_request_target:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch-cronjob
  cancel-in-progress: false

env:
  POSTGRES_NAME: rca-ci-postgres
  JUMPBOX_NAME: rca-ci-jumpbox
  JUMPBOX_KEY_SECRET: rca-ci-jumpbox-key
  JOB_NAME: rca-ci-cronjob-run
  WORKSPACE_POD: rca-ci-workspace

jobs:
  cronjob:
    name: Install the chart and run one batch from the CronJob
    # Label gate: pull_request_target runs (which get fork PRs and full
    # secrets) only execute when the safe-to-test label was just added.
    if: ${{ github.event_name != 'pull_request_target' || github.event.label.name == 'safe-to-test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LITELLM_SECRET: claude-litellm-creds
      RELEASE: rca-ci-cron
      LOGS_DIR: /workspace/synthetic-logs
      STATE_DIR: /workspace/.rca
    steps:
      # In pull_request_target context the default checkout would use the PR's
      # base branch; explicitly check out the PR head so the PR's code is what
      # gets tested. Falls back to the event's own SHA on push/dispatch.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Cluster access, namespace, images and oc. NS/IMAGE/SSHD_IMAGE (GITHUB_ENV) and oc
      # (GITHUB_PATH) become available to every later step.
      - name: Set up cluster access and tools
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          NS=$(kubectl config view --minify -o jsonpath='{..namespace}')
          if [[ -z "$NS" ]]; then
            echo "::error::no namespace in the kubeconfig current context" >&2
            exit 1
          fi
          echo "::add-mask::$NS"
          kubectl get namespace "$NS" > /dev/null
          echo "NS=$NS" >> "$GITHUB_ENV"
          echo "IMAGE=image-registry.openshift-image-registry.svc:5000/$NS/rhdp-rca-plugin:latest" >> "$GITHUB_ENV"
          echo "SSHD_IMAGE=image-registry.openshift-image-registry.svc:5000/$NS/$JUMPBOX_NAME:latest" >> "$GITHUB_ENV"

          # oc is needed for binary builds (oc start-build --from-dir).
          mkdir -p "$HOME/bin"
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
            | tar -xz -C "$HOME/bin" oc
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build the rca image for this commit
        run: |
          kubectl apply -n "$NS" -f - <<'EOF'
          apiVersion: image.openshift.io/v1
          kind: ImageStream
          metadata:
            name: rhdp-rca-plugin
          EOF
          kubectl apply -n "$NS" -f - <<'EOF'
          apiVersion: build.openshift.io/v1
          kind: BuildConfig
          metadata:
            name: rhdp-rca-plugin
          spec:
            source:
              type: Binary
            strategy:
              type: Docker
              dockerStrategy:
                dockerfilePath: deploy/Dockerfile
            output:
              to:
                kind: ImageStreamTag
                name: rhdp-rca-plugin:latest
          EOF
          oc start-build rhdp-rca-plugin -n "$NS" --from-dir=. --wait

      - name: Regenerate the synthetic job logs
        run: python3 ci/synthetic-logs/generate.py

      - name: Generate CI jumpbox keypair
        run: |
          rm -f /tmp/ci_jumpbox_key /tmp/ci_jumpbox_key.pub
          ssh-keygen -t ed25519 -N "" -f /tmp/ci_jumpbox_key -C rca-ci -q
          kubectl create secret generic "$JUMPBOX_KEY_SECRET" -n "$NS" \
            --from-file=id_ed25519=/tmp/ci_jumpbox_key \
            --from-file=id_ed25519.pub=/tmp/ci_jumpbox_key.pub \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Build the CI jumpbox image
        run: |
          oc new-build --binary --strategy docker --name "$JUMPBOX_NAME" -n "$NS" 2>/dev/null || true
          oc start-build "$JUMPBOX_NAME" -n "$NS" --from-dir=ci/images/sshd --wait

      - name: Create CI Postgres and CI jumpbox
        run: |
          kubectl apply -n "$NS" -f ci/manifests/postgres.yaml
          sed "s|IMAGE_PLACEHOLDER|$SSHD_IMAGE|" ci/manifests/sshd.yaml | kubectl apply -n "$NS" -f -
          # The keypair is regenerated every run; force the sshd to pick up
          # the new authorized key rather than relying on secret-volume refresh.
          kubectl rollout restart deployment/$JUMPBOX_NAME -n "$NS"
          kubectl rollout status deployment/$POSTGRES_NAME -n "$NS" --timeout=180s
          kubectl rollout status deployment/$JUMPBOX_NAME -n "$NS" --timeout=180s

      - name: Install the chart with CI values
        run: |
          # Image and SSH endpoints come from ci/values-cronjob.yaml; only
          # secrets are passed here.
          # LiteLLM credentials are extracted from the in-cluster secret and
          # re-fed to Helm, which creates the chart's own secret from them.
          LITELLM_URL=$(kubectl get secret "$LITELLM_SECRET" -n "$NS" -o jsonpath='{.data.ANTHROPIC_BASE_URL}' | base64 -d)
          LITELLM_KEY=$(kubectl get secret "$LITELLM_SECRET" -n "$NS" -o jsonpath='{.data.ANTHROPIC_API_KEY}' | base64 -d)
          if [[ -z "$LITELLM_URL" || -z "$LITELLM_KEY" ]]; then
            echo "::error::$LITELLM_SECRET is missing ANTHROPIC_BASE_URL/ANTHROPIC_API_KEY" >&2
            exit 1
          fi

          helm upgrade --install "$RELEASE" deploy/helm -n "$NS" \
            -f ci/values-cronjob.yaml \
            --set-string secrets.litellm.baseUrl="$LITELLM_URL" \
            --set-string secrets.litellm.apiKey="$LITELLM_KEY" \
            --set-file secrets.skillConfig.settingsJson=ci/settings-cronjob.json \
            --set-file secrets.ssh.privateKey=/tmp/ci_jumpbox_key

      - name: Start workspace helper pod on the chart PVC
        run: |
          kubectl delete pod "$WORKSPACE_POD" -n "$NS" --ignore-not-found
          cat <<EOF | kubectl apply -n "$NS" -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: $WORKSPACE_POD
          spec:
            restartPolicy: Never
            containers:
            - name: workspace
              image: $IMAGE
              command: ["/bin/bash", "-c"]
              args: ["sleep infinity"]
              volumeMounts:
              - name: workspace
                mountPath: /workspace
            volumes:
            - name: workspace
              persistentVolumeClaim:
                claimName: $RELEASE-pvc
          EOF
          kubectl wait --for=condition=ready "pod/$WORKSPACE_POD" -n "$NS" --timeout=180s

      - name: Stage synthetic logs and seed the database
        run: |
          kubectl exec -n "$NS" "$WORKSPACE_POD" -- mkdir -p "$LOGS_DIR" /tmp/ci
          tar -C ci/synthetic-logs -cf - . | kubectl exec -i -n "$NS" "$WORKSPACE_POD" -- tar -xf - -C "$LOGS_DIR"
          kubectl exec -i -n "$NS" "$WORKSPACE_POD" -- bash -c "cat > /tmp/ci/seed_test_db.py" < ci/seed_test_db.py
          kubectl exec -i -n "$NS" "$WORKSPACE_POD" -- bash -c "cat > /tmp/ci/settings.json" < ci/settings-localdb.json
          kubectl exec -n "$NS" "$WORKSPACE_POD" -- \
            env RCA_SETTINGS_FILE=/tmp/ci/settings.json JOB_LOGS_DIR="$LOGS_DIR" \
            python /tmp/ci/seed_test_db.py

      - name: Run one batch from the CronJob
        run: |
          kubectl delete job "$JOB_NAME" -n "$NS" --ignore-not-found
          kubectl create job "$JOB_NAME" -n "$NS" --from="cronjob/$RELEASE-batch"
          bash ci/wait_for_job.sh

      - name: Fetch and verify the batch report
        run: |
          REPORT=$(kubectl exec -n "$NS" "$WORKSPACE_POD" -- bash -c "ls -1t $STATE_DIR/reports/batch_*.json | head -1")
          echo "report: $REPORT"
          mkdir -p out
          kubectl exec -n "$NS" "$WORKSPACE_POD" -- cat "$REPORT" > out/batch_report.json
          kubectl logs -n "$NS" "job/$JOB_NAME" --all-containers > out/batch.log || true
          python3 ci/verify_report.py out/batch_report.json

      - name: Verify uploads landed on the CI jumpbox
        run: |
          UPLOADED=$(kubectl exec -n "$NS" "deployment/$JUMPBOX_NAME" -- ls -1 /usr/local/mlflow | sort | tr '\n' ' ')
          echo "uploaded: $UPLOADED"
          # Capture first so set -e catches a python failure; inside
          # `for ... in $(...)` it would silently yield an empty loop.
          ANALYZED=$(python3 -c "
          import json
          report = json.load(open('out/batch_report.json'))
          print(' '.join(s['job_id'] for s in report['job_summaries'] if s['status'] == 'analyzed'))
          ")
          for jid in $ANALYZED; do
            if ! grep -qw "$jid" <<< "$UPLOADED"; then
              echo "::error::analyzed job $jid has no upload directory on the CI jumpbox"
              exit 1
            fi
          done

      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-cronjob-run
          path: out/
          if-no-files-found: ignore

      - name: Cleanup
        # Toggle without commits: gh variable set CI_SKIP_CLEANUP --body "true"
        if: ${{ always() && vars.CI_SKIP_CLEANUP != 'true' }}
        run: |
          helm uninstall "$RELEASE" -n "$NS" 2>/dev/null || true
          kubectl delete job "$JOB_NAME" -n "$NS" --ignore-not-found
          kubectl delete pod "$WORKSPACE_POD" -n "$NS" --ignore-not-found
          kubectl delete deployment "$POSTGRES_NAME" service "$POSTGRES_NAME" -n "$NS" --ignore-not-found
          kubectl delete deployment "$JUMPBOX_NAME" service "$JUMPBOX_NAME" -n "$NS" --ignore-not-found
          kubectl delete secret "$JUMPBOX_KEY_SECRET" -n "$NS" --ignore-not-found

      - name: Notice cleanup skipped
        if: ${{ always() && vars.CI_SKIP_CLEANUP == 'true' }}
        run: |
          echo "::notice::Cleanup skipped (CI_SKIP_CLEANUP=true) — resources left in the namespace for inspection."
