name: Batch analysis (OpenShift)

# Self-contained batch-analysis test against a real OpenShift cluster:
#   1. Creates a fresh workspace PVC, an in-cluster CI Postgres, and an
#      in-cluster sshd "jumpbox" (built from ci/images/sshd).
#   2. Stages the synthetic job logs (from the repo) onto the PVC and seeds
#      the matching event rows into Postgres.
#   3. Runs the batch analysis as a Job using the real rca image — logs are
#      read from JOB_LOGS_DIR on the PVC and uploads go to the CI jumpbox.
#      Nothing leaves the cluster: no bastion, no real jumpbox, no SSH.
#   4. Verifies the report and the uploads, and uploads them as artifacts.
#
# All batch configuration lives in ci/settings-localdb.json (repo) plus the
# litellm secret in the target namespace. The only GitHub-side secret is
# KUBECONFIG_B64.

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Namespace to run in (must hold the litellm secret)
        required: true
        default: rca-ci
      image:
        description: rca image the batch pod runs (as built by the chart's BuildConfig)
        required: true
        default: image-registry.openshift-image-registry.svc:5000/rhdp-rca-plugin:latest
      sshd_image:
        description: Prebuilt CI jumpbox image (empty = build from ci/images/sshd in-cluster)
        required: false
        default: ""
      logs_dir:
        description: JOB_LOGS_DIR inside the workspace PVC
        required: true
        default: /workspace/synthetic-logs
      state_dir:
        description: RCA_STATE_DIR inside the workspace PVC
        required: true
        default: /workspace/.rca
      litellm_secret:
        description: Secret with ANTHROPIC_BASE_URL / ANTHROPIC_API_KEY
        required: true
        default: claude-litellm-creds

permissions:
  contents: read

concurrency:
  group: batch-openshift-${{ inputs.namespace }}
  cancel-in-progress: false

env:
  PVC_NAME: rca-ci-workspace
  POSTGRES_NAME: rca-ci-postgres
  JUMPBOX_NAME: rca-ci-jumpbox
  JUMPBOX_KEY_SECRET: rca-ci-jumpbox-key
  JOB_NAME: rca-ci-batch-run
  WORKSPACE_POD: rca-ci-workspace

jobs:
  batch:
    name: Run batch analysis with synthetic jobs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NS: ${{ inputs.namespace }}
      IMAGE: ${{ inputs.image }}
      LOGS_DIR: ${{ inputs.logs_dir }}
      STATE_DIR: ${{ inputs.state_dir }}
      LITELLM_SECRET: ${{ inputs.litellm_secret }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure cluster access
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl get namespace "$NS" > /dev/null

      - name: Generate CI jumpbox keypair
        run: |
          rm -f /tmp/ci_jumpbox_key /tmp/ci_jumpbox_key.pub
          ssh-keygen -t ed25519 -N "" -f /tmp/ci_jumpbox_key -C rca-ci -q
          kubectl create secret generic "$JUMPBOX_KEY_SECRET" -n "$NS" \
            --from-file=id_ed25519=/tmp/ci_jumpbox_key \
            --from-file=id_ed25519.pub=/tmp/ci_jumpbox_key.pub \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Build the CI jumpbox image (unless prebuilt)
        if: ${{ inputs.sshd_image == '' }}
        run: |
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/oc.tar.gz \
            | tar -xz -C /tmp oc
          sudo mv /tmp/oc /usr/local/bin/oc
          export KUBECONFIG="$HOME/.kube/config"
          oc new-build --binary --strategy docker --name "$JUMPBOX_NAME" -n "$NS" 2>/dev/null || true
          oc start-build "$JUMPBOX_NAME" -n "$NS" --from-dir=ci/images/sshd --wait

      - name: Resolve CI jumpbox image
        run: |
          if [[ -n "${{ inputs.sshd_image }}" ]]; then
            echo "SSHD_IMAGE=${{ inputs.sshd_image }}" >> "$GITHUB_ENV"
          else
            echo "SSHD_IMAGE=image-registry.openshift-image-registry.svc:5000/$NS/$JUMPBOX_NAME:latest" >> "$GITHUB_ENV"
          fi

      - name: Create workspace PVC, CI Postgres, and CI jumpbox
        run: |
          cat <<EOF | kubectl apply -n "$NS" -f -
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: $PVC_NAME
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 1Gi
          EOF
          kubectl apply -n "$NS" -f ci/manifests/postgres.yaml
          sed "s|IMAGE_PLACEHOLDER|$SSHD_IMAGE|" ci/manifests/sshd.yaml | kubectl apply -n "$NS" -f -
          kubectl rollout status deployment/$POSTGRES_NAME -n "$NS" --timeout=180s
          kubectl rollout status deployment/$JUMPBOX_NAME -n "$NS" --timeout=180s

      - name: Start workspace helper pod
        run: |
          kubectl delete pod "$WORKSPACE_POD" -n "$NS" --ignore-not-found
          cat <<EOF | kubectl apply -n "$NS" -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: $WORKSPACE_POD
          spec:
            restartPolicy: Never
            containers:
            - name: workspace
              image: $IMAGE
              command: ["/bin/bash", "-c"]
              args: ["sleep infinity"]
              volumeMounts:
              - name: workspace
                mountPath: /workspace
            volumes:
            - name: workspace
              persistentVolumeClaim:
                claimName: $PVC_NAME
          EOF
          kubectl wait --for=condition=ready "pod/$WORKSPACE_POD" -n "$NS" --timeout=180s

      - name: Regenerate the synthetic job logs
        run: python3 ci/synthetic-logs/generate.py

      - name: Stage synthetic logs and scripts onto the workspace
        run: |
          kubectl exec -n "$NS" "$WORKSPACE_POD" -- mkdir -p "$LOGS_DIR" /workspace/.ci
          for f in ci/synthetic-logs/*; do
            kubectl exec -i -n "$NS" "$WORKSPACE_POD" -- bash -c "cat > $LOGS_DIR/$(basename "$f")" < "$f"
          done
          for f in ci/seed_test_db.py ci/run_batch_in_cluster.sh; do
            kubectl exec -i -n "$NS" "$WORKSPACE_POD" -- bash -c "cat > /workspace/.ci/$(basename "$f")" < "$f"
          done
          POSTGRES_SERVICE="$POSTGRES_NAME.$NS.svc.cluster.local"
          sed "s/__POSTGRES_SERVICE__/$POSTGRES_SERVICE/" ci/settings-localdb.json \
            | kubectl exec -i -n "$NS" "$WORKSPACE_POD" -- bash -c "cat > /workspace/.ci/settings.json"
          kubectl exec -n "$NS" "$WORKSPACE_POD" -- ls -l "$LOGS_DIR"

      - name: Seed the synthetic events into CI Postgres
        run: |
          kubectl exec -n "$NS" "$WORKSPACE_POD" -- \
            env RCA_SETTINGS_FILE=/workspace/.ci/settings.json JOB_LOGS_DIR="$LOGS_DIR" \
            python /workspace/.ci/seed_test_db.py

      - name: Run the batch analysis
        run: |
          kubectl delete job "$JOB_NAME" -n "$NS" --ignore-not-found
          cat <<EOF | kubectl apply -n "$NS" -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $JOB_NAME
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 1200
            template:
              metadata:
                labels:
                  app: rca-ci-batch
              spec:
                restartPolicy: Never
                containers:
                - name: batch-rca
                  image: $IMAGE
                  command: ["/bin/bash", "/workspace/.ci/run_batch_in_cluster.sh"]
                  env:
                  - name: HOME
                    value: /workspace
                  - name: RCA_STATE_DIR
                    value: $STATE_DIR
                  - name: JOB_LOGS_DIR
                    value: $LOGS_DIR
                  - name: RCA_SETTINGS_FILE
                    value: /workspace/.ci/settings.json
                  - name: CLAUDE_CODE_ACCEPT_TOS
                    value: "true"
                  - name: RCA_CI_LIMIT
                    value: "10"
                  - name: CI_JUMPBOX_HOST
                    value: $JUMPBOX_NAME.$NS.svc.cluster.local
                  envFrom:
                  - secretRef:
                      name: $LITELLM_SECRET
                  volumeMounts:
                  - name: workspace
                    mountPath: /workspace
                  - name: ci-jumpbox-key
                    mountPath: /tmp/ci-jumpbox-key
                    readOnly: true
                volumes:
                - name: workspace
                  persistentVolumeClaim:
                    claimName: $PVC_NAME
                - name: ci-jumpbox-key
                  secret:
                    secretName: $JUMPBOX_KEY_SECRET
          EOF
          bash ci/wait_for_job.sh

      - name: Fetch and verify the batch report
        run: |
          REPORT=$(kubectl exec -n "$NS" "$WORKSPACE_POD" -- bash -c "ls -1t $STATE_DIR/reports/batch_*.json | head -1")
          echo "report: $REPORT"
          mkdir -p out
          kubectl exec -n "$NS" "$WORKSPACE_POD" -- cat "$REPORT" > out/batch_report.json
          kubectl logs -n "$NS" "job/$JOB_NAME" --all-containers > out/batch.log || true
          python ci/verify_report.py out/batch_report.json

      - name: Verify uploads landed on the CI jumpbox
        run: |
          UPLOADED=$(kubectl exec -n "$NS" "deployment/$JUMPBOX_NAME" -- ls -1 /usr/local/mlflow | sort | tr '\n' ' ')
          echo "uploaded: $UPLOADED"
          for jid in $(python3 -c "
          import json
          report = json.load(open('out/batch_report.json'))
          print(' '.join(s['job_id'] for s in report['job_summaries'] if s['status'] == 'analyzed'))
          "); do
            if ! grep -qw "$jid" <<< "$UPLOADED"; then
              echo "::error::analyzed job $jid has no upload directory on the CI jumpbox"
              exit 1
            fi
          done

      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-run
          path: out/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          kubectl delete job "$JOB_NAME" -n "$NS" --ignore-not-found
          kubectl delete pod "$WORKSPACE_POD" -n "$NS" --ignore-not-found
          kubectl delete deployment "$POSTGRES_NAME" service "$POSTGRES_NAME" -n "$NS" --ignore-not-found
          kubectl delete deployment "$JUMPBOX_NAME" service "$JUMPBOX_NAME" -n "$NS" --ignore-not-found
          kubectl delete secret "$JUMPBOX_KEY_SECRET" -n "$NS" --ignore-not-found
