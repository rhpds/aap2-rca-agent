git:
  uri: https://github.com/rhpds/aap2-rca-agent.git
  ref: main

image:
  registry: image-registry.openshift-image-registry.svc:5000
  name: rhdp-rca-plugin
  tag: latest

cronjob:
  schedule: "7,37 * * * *"
  limit: 15
  maxParallelJobs: 5
  since: "30 minutes"
  period: 30m
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

pvc:
  storage: 5Gi
  storageClassName: ""

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

claude:
  backend: "vertex"        # "vertex" (default) or "litellm"
  model: "claude-sonnet-4-6"

secrets:
  names:
    vertexCreds: claude-vertex-creds
    litellmCreds: claude-litellm-creds
    skillConfig: rca-skill-config
    sshKey: ci-ssh-key
    webhookSecret: rhdp-rca-plugin-webhook-secret
  vertex:
    cloudMlRegion: ""
    projectId: ""
    gcpCredentials: ""
  litellm:
    baseUrl: ""            # e.g. https://<your-litemaas-endpoint>
    apiKey: ""             # LiteMaaS-issued key (not an Anthropic key)
  skillConfig:
    settingsJson: ""
  ssh:
    privateKey: ""
    bastionHostname: ""
    bastionUsername: ""
    bastionPort: ""
    dbBastionHostname: ""
    dbBastionUsername: ""
    dbBastionPort: ""
    dbRemoteHost: ""
    dbRemotePort: ""
    jumpboxHostname: ""
    jumpboxUsername: ""
    jumpboxPort: ""

evalPod:
  enabled: false
