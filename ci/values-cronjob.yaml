# Chart values for the CI CronJob test (tier 2). Secret values (litellm creds,
# SSH key, settingsJson) are passed via --set by the workflow at install time.
# Everything else is fixed: the CI jumpbox and Postgres live in the same
# namespace as the release, so short service names resolve.
image:
  registry: image-registry.openshift-image-registry.svc:5000
  name: rhdp-rca-plugin
  tag: latest

cronjob:
  schedule: "0 0 31 2 *"   # never fires on its own; CI runs a Job derived from the CronJob
  limit: 10
  maxParallelJobs: 5
  since: "2 hours"
  period: 30m
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1

pvc:
  storage: 1Gi
  storageClassName: ""

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

claude:
  backend: "litellm"
  model: "claude-sonnet-4-6"

ssh:
  jumpboxAlias: ci-jumpbox

secrets:
  names:
    # Distinct from the tier-1 claude-litellm-creds secret: Helm creates and
    # owns this one from the values the workflow passes at install time, and
    # it cannot adopt the pre-existing tier-1 secret.
    litellmCreds: rca-ci-cron-litellm-creds
    skillConfig: rca-skill-config
    sshKey: ci-ssh-key
    webhookSecret: rhdp-rca-plugin-webhook-secret
  litellm:
    baseUrl: ""            # set by the workflow from the in-cluster secret
    apiKey: ""
  skillConfig:
    settingsJson: ""       # set by the workflow from ci/settings-cronjob.json
  ssh:                     # every endpoint is the CI jumpbox; it forwards to the CI Postgres
    privateKey: ""         # set by the workflow (regenerated every run)
    bastionHostname: rca-ci-jumpbox
    bastionUsername: testuser
    bastionPort: "2222"
    dbBastionHostname: rca-ci-jumpbox
    dbBastionUsername: testuser
    dbBastionPort: "2222"
    dbRemoteHost: rca-ci-postgres
    dbRemotePort: "5432"
    jumpboxHostname: rca-ci-jumpbox
    jumpboxUsername: testuser
    jumpboxPort: "2222"

buildconfig:
  enabled: false

evalPod:
  enabled: false
